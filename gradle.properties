org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Maven Central publishing (com.vanniktech.maven.publish). Coordinates are set in
# link/build.gradle.kts; credentials and signing come from CI secrets at release
# time (MAVEN_USERNAME, MAVEN_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD).
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true

GROUP=com.meshpay
POM_ARTIFACT_ID=link

POM_NAME=Mesh Link Android SDK
POM_DESCRIPTION=Opens the hosted Mesh Link UI full screen in a WebView.
POM_URL=https://github.com/FrontFin/android-sdk
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://github.com/FrontFin/android-sdk/blob/main/LICENSE
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/FrontFin/android-sdk
POM_SCM_CONNECTION=scm:git:git://github.com/FrontFin/android-sdk.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/FrontFin/android-sdk.git
POM_DEVELOPER_ID=meshpay
POM_DEVELOPER_NAME=Mesh Connect, Inc.
POM_DEVELOPER_URL=https://meshpay.com
