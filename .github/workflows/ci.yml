# Runs on pull requests to main and on manual triggers. Same jobs and step order
# as FrontFin/mesh-android-sdk's CI, with the names, paths and coordinates changed
# for com.meshpay:link.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Exposed to `if:` below so SonarQube is skipped until the secret exists.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 ☕
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 🤖
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 🐘
        uses: gradle/actions/setup-gradle@v4

      - name: Lint — ktlint + detekt 🧹
        run: ./gradlew link:ktlintCheck link:detekt

      - name: Android Lint 🔎
        run: ./gradlew link:lintRelease

      - name: Unit tests + coverage verification 🧪
        run: ./gradlew link:jacocoCoverageVerification

      - name: Assemble release AAR 📦
        run: ./gradlew link:assembleRelease

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar
