# Runs on pull requests to main, on manual triggers, and as a reusable workflow
# called by release.yml before publishing. Same jobs and step order as
# FrontFin/mesh-android-sdk's CI, with the names, paths and coordinates changed
# for com.meshpay:link.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21 ☕
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 🤖
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Set up Gradle 🐘
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Lint — ktlint + detekt 🧹
        run: ./gradlew link:ktlintCheck link:detekt

      # Fails when the public API differs from link/api/link.api. Run
      # `./gradlew link:apiDump` and commit the file to make a deliberate change.
      - name: Public API check 🔒
        run: ./gradlew link:apiCheck

      - name: Android Lint 🔎
        run: ./gradlew link:lintRelease

      - name: Unit tests + coverage verification 🧪
        run: ./gradlew link:jacocoCoverageVerification

      - name: Assemble release AAR 📦
        run: ./gradlew link:assembleRelease
